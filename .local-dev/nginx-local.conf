# Local (non-Docker) variant of gateway/nginx.conf: same routing, localhost
# upstreams, and /tmp paths so it can run without touching system dirs.
pid /tmp/nginx-url-shortener.pid;
worker_processes 2;

events {
    worker_connections 1024;
}

http {
    access_log /tmp/nginx-url-shortener-access.log;
    error_log /tmp/nginx-url-shortener-error.log warn;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    upstream shortener {
        server 127.0.0.1:8001;
    }

    upstream redirect {
        server 127.0.0.1:8002;
    }

    server {
        listen 8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;

        location = /healthz {
            return 200 "ok\n";
        }

        location /api/ {
            proxy_pass http://shortener;
        }
        location /docs {
            proxy_pass http://shortener;
        }
        location /openapi.json {
            proxy_pass http://shortener;
        }

        location / {
            proxy_pass http://redirect;
        }
    }
}
