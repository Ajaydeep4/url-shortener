# Deployment override: run prebuilt images from GHCR instead of building
# locally, with per-environment configuration injected via an env file.
#
# Usage on a droplet (dev/stage/prod):
#   docker compose --env-file deploy/<env>.env \
#     -f docker-compose.yml -f docker-compose.deploy.yml up -d
#
# IMAGE_REPO   e.g. ghcr.io/<owner>/<repo>   (lowercase)
# IMAGE_TAG    e.g. dev, stage, v1.2.0, or a git sha
name: url-shortener

services:
  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shortener}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy env file}
      POSTGRES_DB: ${POSTGRES_DB:-shortener}
    restart: unless-stopped

  redis:
    restart: unless-stopped

  shortener-service:
    build: !reset null
    image: ${IMAGE_REPO:?set in deploy env file}/shortener-service:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-shortener}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shortener}
      BASE_URL: ${BASE_URL:?set in deploy env file}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped

  redirect-service:
    build: !reset null
    image: ${IMAGE_REPO}/redirect-service:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-shortener}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shortener}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped

  analytics-worker:
    build: !reset null
    image: ${IMAGE_REPO}/analytics-worker:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-shortener}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shortener}
      REDIS_URL: redis://redis:6379/0
    restart: unless-stopped

  gateway:
    build: !reset null
    image: ${IMAGE_REPO}/gateway:${IMAGE_TAG:-latest}
    ports:
      - "${GATEWAY_PORT:-80}:8080"
    restart: unless-stopped
