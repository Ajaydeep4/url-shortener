worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format json_combined escape=json
        '{"timestamp":"$time_iso8601","service":"gateway","request_id":"$request_id",'
        '"method":"$request_method","path":"$request_uri","status":$status,'
        '"duration_ms":$request_time,"upstream":"$upstream_addr"}';
    access_log /dev/stdout json_combined;
    error_log /dev/stderr warn;

    upstream shortener {
        server shortener-service:8000;
    }

    upstream redirect {
        server redirect-service:8000;
    }

    server {
        listen 8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Propagated into every service's structured logs for correlation.
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;

        location = /healthz {
            return 200 "ok\n";
        }

        # Write side: creation + metadata (and interactive API docs).
        location /api/ {
            proxy_pass http://shortener;
        }
        location /docs {
            proxy_pass http://shortener;
        }
        location /openapi.json {
            proxy_pass http://shortener;
        }

        # Read side: everything else is treated as a short link.
        location / {
            proxy_pass http://redirect;
        }
    }
}
